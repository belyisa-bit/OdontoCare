# Automated tests must never create or modify the local file-backed database.
spring.application.name=clinica-odonto-api-test
spring.datasource.url=jdbc:h2:mem:odontocare-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
jwt.secret=${JWT_SECRET:odontocare-test-jwt-secret-key-2026-0123456789}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
