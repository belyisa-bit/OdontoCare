# Local development: run the backend from the backend directory.
spring.application.name=clinica-odonto-api
server.port=8080

# File-backed H2 keeps accounts between application restarts.
# Override these variables when using another database/environment.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/odontocare;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Set a private, high entropy secret in each environment.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
