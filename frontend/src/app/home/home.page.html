<ion-header class="ion-no-border"><app-page-header></app-page-header></ion-header>

<ion-content class="home-content">
  <main class="home-layout">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">Cuide do seu <span>sorriso</span> com os melhores profissionais</h1>
        <p>Conheça nossa equipe e encontre o cuidado ideal para o seu sorriso.</p>
        <ion-button class="primary-action" routerLink="/dentistas">
          Conhecer nossa equipe
          <ion-icon slot="end" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </ion-button>
      </div>

      <div class="hero-art" aria-hidden="true">
        <picture
          ><source media="(max-width: 760px)" srcset="assets/images/consultorio-mobile.webp" />
          <img
            src="assets/images/consultorio.webp"
            width="1440"
            height="810"
            alt=""
            fetchpriority="high"
            decoding="async"
        /></picture>
      </div>
      <svg class="hero-wave" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 48C200-25 310 140 590 68S850 20 1000 0V100H0Z" fill="#c8e9ff" />
        <path d="M0 76C190-12 360 140 650 78S850 45 1000 34V100H0Z" fill="#f2f7ff" />
      </svg>
    </section>

    <section class="specialties" aria-labelledby="specialties-title">
      <div class="section-heading">
        <div>
          <h2 id="specialties-title">Especialidades</h2>
        </div>
        <button
          type="button"
          class="specialties-toggle"
          [attr.aria-expanded]="specialtiesExpanded()"
          aria-controls="specialty-grid"
          (click)="toggleSpecialties()"
        >
          {{ specialtiesExpanded() ? 'Mostrar menos' : 'Ver todas' }}
          <ion-icon name="arrow-forward-outline" [class.expanded]="specialtiesExpanded()" aria-hidden="true"></ion-icon>
        </button>
      </div>
      <div class="specialty-grid" id="specialty-grid">
        @for (specialty of visibleSpecialties(); track specialty.name) {
        <a class="specialty-card" routerLink="/dentistas" [queryParams]="{ especialidade: specialty.name }">
          <span class="specialty-icon">
            <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
              @switch (specialty.icon) { @case ('tooth') {
              <path
                d="M32 12C17 2 7 11 10 26c2 10 7 28 13 28 5 0 3-19 9-19s4 19 9 19c6 0 11-18 13-28C57 11 47 2 32 12Z"
              />
              <path d="m32 12 8 3" />
              } @case ('braces') {
              <path
                d="M18 22v-2c0-9 14-9 14 0v2m7 0v-2c0-9 14-9 14 0v2M18 42v2c0 9 14 9 14 0v-2m7 0v2c0 9 14 9 14 0v-2"
                transform="translate(-4 0)"
              />
              <rect x="15" y="27" width="13" height="11" rx="3" />
              <rect x="36" y="27" width="13" height="11" rx="3" />
              <path d="M5 32h54" />
              } @case ('implant') {
              <path class="implant-crown" d="M32 12c-9-8-21-2-18 8 1 4 5 8 8 11h20c3-3 7-7 8-11 3-10-9-16-18-8Z" />
              <rect x="20" y="30" width="24" height="7" rx="3" />
              <path d="m23 38 2 15c1 7 13 7 14 0l2-15M23 43h17M25 49h14" />
              } @case ('root-canal') {
              <path
                d="M32 12C17 2 7 11 10 26c2 10 7 28 13 28 5 0 3-19 9-19s4 19 9 19c6 0 11-18 13-28C57 11 47 2 32 12Z"
              />
              <path d="M25 22c0 8 7 7 7 14m7-14c0 8-7 7-7 14m0-14v14" />
              } @case ('gum') {
              <path d="M22 39c-3-8-7-15-7-22 0-10 10-12 17-6 7-6 17-4 17 6 0 7-4 14-7 22M32 30v11" />
              <path d="M8 37c7-9 15 10 24 1 9 9 17-10 24-1v16H8Z" />
              } @case ('child') {
              <path d="M31 15C19 7 10 14 13 27c2 9 6 23 11 23 4 0 2-15 7-15s3 15 7 15c5 0 9-14 11-23" />
              <path d="m48 5 2 6 7 2-7 2-2 7-2-7-7-2 7-2Z" />
              <path d="M23 25h1m13 0h1m-12 5c3 3 7 3 10 0" />
              } @case ('surgery') {
              <path d="m13 51 23-23 6 6-23 23Zm23-23 7-15c4-7 12-9 15-8-1 8-5 16-13 23l-3 6M8 13h14m-7-7v14" />
              } @case ('crown') {
              <path d="m10 20 10 8 12-14 12 14 10-8-7 28H17Zm7 28v7h30v-7M21 36h22" />
              } @case ('restoration') {
              <path d="M29 13C17 5 7 12 10 26c2 10 7 28 13 28 5 0 3-19 9-19s4 19 9 19c5 0 10-15 12-25" />
              <path d="m45 5 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z" />
              } @case ('xray') {
              <rect x="8" y="5" width="48" height="54" rx="6" />
              <path
                d="M32 19c-9-6-17-1-15 8 2 7 4 19 8 19 3 0 3-12 7-12s4 12 7 12c4 0 6-12 8-19 2-9-6-14-15-8Zm0 6v9M14 12h4m28 40h4"
              />
              } }
            </svg>
          </span>
          <h3>{{ specialty.name }}</h3>
        </a>
        }
      </div>
    </section>
  </main>
  <app-site-footer></app-site-footer>
</ion-content>
